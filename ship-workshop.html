<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凱爾特飛船工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Iansui&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 飛行船分頁內容。由 game-test.html 以 iframe 載入，也可單獨開啟測試。
   手機直式：上方飛船舞台，下方兩個分頁：提煉工坊／背包。單一亮色主題（羊皮紙底）。 */
:root{
  --parch:#f3e7c9; --parch2:#e6d3a4; --ink:#4a2f1a; --green:#2f5d46; --gold:#b8892f; --night:#14213d;
  --line:#c9ae72; --ok:#2f7a4f; --warn:#a4472b;
  --font-d:'Iansui','Noto Sans TC',serif; --font-b:'Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--parch);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:10px 12px 14px}
.stage{border:3px double var(--gold);border-radius:14px;overflow:hidden;background:var(--night);position:relative}
.stage svg{display:block;width:100%;height:auto}
.stage.flash::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,240,190,.55),transparent 70%);animation:fade .9s ease-out forwards;pointer-events:none}
@keyframes fade{from{opacity:1}to{opacity:0}}
.status{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0;font-size:13px}
.pill{white-space:nowrap;display:inline-block;margin:0 4px 4px 0;background:var(--parch2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.msg{min-height:44px;margin:8px 0;padding:8px 12px;border-left:4px solid var(--green);background:#efe0b8;border-radius:6px;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:6px 0 10px}
.tabs button{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;font:700 16px var(--font-b);color:var(--ink);background:var(--parch2);border:2px solid var(--line);border-radius:10px}
.tabs button[aria-selected="true"]{background:var(--green);color:#fdf6dd;border-color:var(--green)}
button{cursor:pointer}
button:focus-visible{outline:3px solid #1d6fd1;outline-offset:2px}
h2{font-family:var(--font-d);font-size:20px;margin:14px 0 6px;font-weight:400}
.card{background:#f9f0d8;border:2px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.card.gift{border-color:var(--gold);background:#fbefc7}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sname{font-weight:700;font-size:17px}
.pips{display:flex;gap:4px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);background:transparent}
.pip.on{background:var(--gold)}
.desc{font-size:14px;margin:4px 0 8px;color:#6b4c2a}
.need{font-size:14px;margin:0 0 8px}
.btn{min-height:48px;padding:0 16px;font:700 16px var(--font-b);border-radius:10px;border:2px solid var(--green);background:var(--green);color:#fdf6dd;width:100%}
.btn[disabled]{background:#d9cba4;border-color:#cdbb8a;color:#8d7a52;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--green)}
.btn.small{width:auto;min-height:40px;padding:0 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px;padding:8px 4px;background:#fbf4de;border:2px solid var(--line);border-radius:10px;font:500 14px var(--font-b);color:var(--ink)}
.chip b{font-size:15px}
.chip small{color:#7a5a36;font-size:12px}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.gem{width:26px;height:26px}
.circle{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 10px}
.slotbox{width:84px;height:84px;border-radius:50%;border:3px dashed var(--gold);background:#fbf4de;display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 13px var(--font-b);color:var(--ink);padding:0}
.slotbox.full{border-style:solid}
.plus{font:700 24px var(--font-d);color:var(--gold)}
.preview{text-align:center;min-height:48px;margin:0 0 8px;font-size:15px}
.preview.bad{color:var(--warn)}
details{margin:6px 0}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.rec{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rec:last-child{border-bottom:0}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);background:var(--parch2);white-space:nowrap}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--ink);flex:none}
select{min-height:44px;font:500 16px var(--font-b);border:2px solid var(--line);border-radius:8px;background:#fbf4de;color:var(--ink);padding:0 8px}
.notes{font-size:13px;color:#6b4c2a;padding-left:18px;margin:6px 0}
.notes li{margin:3px 0}
.spin{transform-box:fill-box;transform-origin:center;animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.flame{transform-origin:28px 221px;animation:fl .35s ease-in-out infinite alternate}
@keyframes fl{to{transform:scaleX(.78)}}
.pulse{animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.spin,.bob,.flame,.pulse,.stage.flash::after{animation:none}}
.ic{flex:none}.ic.inl{vertical-align:-6px;color:var(--gold)}
.tabs button .ic{color:var(--gold)}.tabs button[aria-selected="true"] .ic{color:#f1d98a}
.partrow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 10px}
.partbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;padding:4px 2px;border:2px solid var(--line);border-radius:10px;background:#fbf4de;color:var(--ink);font:700 13px var(--font-b)}
.partbtn .ic{color:var(--gold)}
.partbtn[aria-pressed="true"]{background:var(--green);color:#fdf6dd;border-color:var(--green)}.partbtn[aria-pressed="true"] .ic{color:#f1d98a}
.mc{display:block;width:100%;max-width:340px;margin:0 auto}
.preview .gem{width:20px;height:20px;vertical-align:-5px}

/* ===== 翻牌升級＋魔法陣動畫（11/13） ===== */
.mc .sl{transform-box:fill-box;transform-origin:center}
.mc .la,.mc .rl,.mc .burst{opacity:0}
.mc .burst{transform-box:fill-box;transform-origin:center}
.mc.cast .sl{animation:fly .8s cubic-bezier(.5,0,.8,.5) forwards;animation-delay:calc(var(--i)*.2s)}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.25);opacity:.15}}
.mc.cast .la{animation:lita .5s ease-out forwards;animation-delay:calc(.35s + var(--i)*.22s)}
@keyframes lita{to{opacity:.95}}
.mc.cast .rl{animation:rl 1.2s ease-in-out .5s forwards}
@keyframes rl{0%{opacity:0}60%{opacity:.55}100%{opacity:.3}}
.mc.cast .burst{animation:bst .5s ease-out 1s forwards}
@keyframes bst{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(2.8)}}
#spot{position:fixed;inset:0;z-index:50;background:rgba(10,8,5,.86);animation:fadein .25s}
@keyframes fadein{from{opacity:0}}
#spot .spotin{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px}
#spot.inframe{position:absolute;left:0;top:0;width:100%}
#spot.inframe .spotin{position:absolute;left:0;right:0;inset:auto;width:100%}
.flip{perspective:1400px;width:min(94vw,480px)}
.card3d{display:grid;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.45,.05,.3,1)}
.card3d.turn{transform:rotateY(180deg)}
.face{grid-area:1/1;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:12px;background:var(--parch);border:4px double var(--gold);box-shadow:0 8px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;gap:8px;align-items:center}
.face.b{transform:rotateY(180deg);background:#fbefc7}
.face h3{margin:0;font:400 22px var(--font-d);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.face h3 .ic{color:var(--gold)}
.face .tagp{font:700 13px var(--font-b);border-radius:999px;padding:1px 10px;background:var(--parch2);border:1px solid var(--line)}
.face.b .tagp{background:var(--green);color:#fdf6dd;border-color:var(--green)}
.face .big{width:100%;border-radius:10px;overflow:hidden;border:2px solid var(--gold);background:var(--night)}
.face .big svg{display:block;width:100%;height:auto;max-height:32vh}
.face .zoom{width:74%;border-radius:12px;overflow:hidden;border:3px solid var(--gold);background:var(--night);position:relative}
.face .zoom svg{display:block;width:100%;height:auto;max-height:25vh}
.face .zoom span{position:absolute;left:6px;top:4px;font:700 12px var(--font-b);color:#f1d98a;background:rgba(20,33,61,.75);padding:1px 8px;border-radius:999px}
.face .fdesc{margin:0;font-size:14px;color:#6b4c2a;text-align:center}
#spot .btn{width:auto;min-width:170px;transition:opacity .3s}
#spot .btn.off{opacity:0;pointer-events:none}
@media (prefers-reduced-motion:reduce){.mc.cast .sl,.mc.cast .la,.mc.cast .rl,.mc.cast .burst{animation:none}.card3d{transition:none}#spot{animation:none}}
</style>
<script src="save-core.js"></script>
<script src="sfx.js"></script>
<script src="wk-core.js"></script>
<script>if(window.Sfx){Sfx.auto('[data-tab]','nav');Sfx.auto('.btn','tap');}</script>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage"></div>
  <div class="status" id="status"></div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="panel"></div>
  <div class="card lab" aria-disabled="true" style="margin-top:16px"><div class="row"><span class="sname"><span id="labic"></span>解鎖生物研究室</span><span class="tag">未開放</span></div><p class="desc" style="margin:6px 0 8px">之後可以在這裡飼養、養殖各島的動植物。</p><button class="btn" disabled>尚未開放</button></div>
</div>

<script src="isle-art.js"></script>
<script>
/* ===== 資料（名稱、配方、數值都是暫定） ===== */
const EL=ISLE_ART.data.map(d=>({id:d.cid,n:d.crystal,isle:d.isle,c:d.c}));   /* 12 島各一種水晶碎片，資料在 isle-art.js */
const SLOTS=[
  {id:'hull',n:'船體',d:['木造小船身','加上欄杆與提燈','加上甲板小屋與第二根桅桿']},
  {id:'sail',n:'風帆',d:['簡單帆面，一個三圈紋','加上後帆與紋樣邊','加上旗幟與符文光環']},
  {id:'wing',n:'機翼',d:['單層羽翼','雙層羽翼','三層羽翼，翼尖有螺旋']},
  {id:'engine',n:'引擎',d:['一組齒輪','兩組齒輪連動','三組齒輪、活塞與長尾焰']},
  {id:'prow',n:'船頭',d:['簡單船頭','螺旋船首像','導航水晶與紋環']}
];
const byId=(arr,id)=>arr.find(x=>x.id===id);
const nameOf=id=>byId(EL,id).n;
const COST=3; /* 每次升級放入 3 顆水晶碎片（任意種類）；位置決定顏色 */

/* ===== 每週任務（要和 weekly-practice.html 一致；讀它的存檔 olm_wk_v2） ===== */
const TASKS=OLM_WK.TASKS;   /* 任務清單在共用的 wk-core.js（含歌曲任務） */
function todayKey(){return new Date(Date.now()+8*3600e3).toISOString().slice(0,10);}
function weekIdx(start){return Math.max(0,Math.floor((Date.parse(todayKey()+'T00:00:00Z')-Date.parse(start+'T00:00:00Z'))/864e5/7));}
function wk(){
  try{
    const o=OLMSave.read(OLMSave.K.WK);
    if(o&&o.v===2){
      const st=o.start||todayKey(), idx=weekIdx(st), prev=typeof o.week==='number'?o.week:0;
      return {has:true,week:idx,tasks:prev===idx?(o.tasks||{}):{}};
    }
  }catch(e){}
  return {has:false,week:0,tasks:{}};
}
function weekDone(w){return TASKS.every(t=>(w.tasks[t.id]|0)>=t.T)&&w.has;}

/* ===== 狀態 ===== */
const KEY='olm_ship_v1';
const DEFAULT_ISLE=4;   /* 測試版不真的開島，「目前練習的島」暫定為地圖上的第 4 島；weekly-practice.html 讀同一個欄位決定掉哪種元素 */
function fresh(){
  return {el:Object.fromEntries(EL.map(e=>[e.id,0])),
    lv:{hull:1,sail:1,wing:1,engine:1,prow:1},cr:{},isle:DEFAULT_ISLE,claimed:-1,fake:-1};
}
function load(){
  const f=fresh();
  try{
    const s=OLMSave.read(KEY); if(!Object.keys(s).length) return f;
    ['el','lv'].forEach(k=>Object.assign(f[k],s[k]||{}));
    if(s.cr&&typeof s.cr==='object') f.cr=s.cr;
    if(s.isle>=1&&s.isle<=12) f.isle=s.isle;
    if(typeof s.claimed==='number') f.claimed=s.claimed;
    if(typeof s.fake==='number') f.fake=s.fake;
  }catch(e){}
  return f;
}
/* 只寫本頁負責的欄位（el、lv、cr、isle），其餘欄位（如別頁新增的）不動 */
function save(){OLMSave.patch(KEY,function(d){d.el=S.el;d.lv=S.lv;d.cr=S.cr;d.isle=S.isle;});}
let S=load(), tab='craft', pick=[null,null,null], mcPart='hull', msg='', openD={tools:false};

/* ===== 繪圖輔助 ===== */
const D='#3a2414', W='#8b5a33', G='#d9b25b';
let GEARC=G, BRAIDC=G;
function gearPath(cx,cy,r,t){
  const ri=r*0.78, step=Math.PI*2/t, pts=[];
  for(let i=0;i<t;i++){
    [[-0.28,ri],[-0.16,r],[0.16,r],[0.28,ri]].forEach(([d,rad])=>{
      const a=i*step+d*step;
      pts.push((cx+Math.cos(a)*rad).toFixed(1)+','+(cy+Math.sin(a)*rad).toFixed(1));
    });
  }
  return 'M'+pts.join('L')+'Z';
}
function spiral(cx,cy,r0,r1,turns){
  let d=''; const n=60;
  for(let i=0;i<=n;i++){
    const t=i/n, a=t*turns*Math.PI*2, r=r0+(r1-r0)*t;
    d+=(i?'L':'M')+(cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1);
  }
  return d;
}
function gear(cx,cy,r,t,dur,rev){
  return `<g class="spin" style="animation-duration:${dur}s;animation-direction:${rev?'reverse':'normal'}"><path d="${gearPath(cx,cy,r,t)}" fill="#a07a3e" stroke="${D}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${cx}" cy="${cy}" r="${(r*0.58).toFixed(1)}" fill="#6d4b24" stroke="${D}" stroke-width="1"/><path d="${spiral(cx,cy,1.5,r*0.5,2.2)}" fill="none" stroke="${GEARC}" stroke-width="1.6" stroke-linecap="round"/></g>`;
}
function emblem(cx,cy,r,col){
  const pts=[0,120,240].map(d=>{const a=(d-90)*Math.PI/180;return [cx+Math.cos(a)*r*0.55,cy+Math.sin(a)*r*0.55];});
  return pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(r*0.6).toFixed(1)}" fill="none" stroke="${col}" stroke-width="2.2"/>`).join('')
    +`<circle cx="${cx}" cy="${cy}" r="${(r*1.25).toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.6"/>`;
}
function braid(x1,x2,y,amp,wl,id){
  let a='',b='';
  for(let x=x1;x<=x2;x+=2){
    const t=(x-x1)/wl*Math.PI*2;
    a+=(x===x1?'M':'L')+x+','+(y+Math.sin(t)*amp).toFixed(1);
    b+=(x===x1?'M':'L')+x+','+(y-Math.sin(t)*amp).toFixed(1);
  }
  const st=d=>`<path d="${d}" fill="none" stroke="${D}" stroke-width="6" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${BRAIDC}" stroke-width="3.2" stroke-linecap="round"/>`;
  let s=st(a)+st(b), k=0;
  for(let x=x1+wl/2;x<x2;x+=wl){
    k++;
    s+=`<clipPath id="${id}${k}"><rect x="${x-7}" y="${y-amp-6}" width="14" height="${amp*2+12}"/></clipPath><g clip-path="url(#${id}${k})">${st(a)}</g>`;
  }
  return s;
}
const STARS=[[-70,80],[-60,140],[430,110],[425,160],[-75,30],[-40,50],[-20,110],[404,70],[410,30],[-50,20],[20,20],[60,60],[110,24],[150,70],[300,26],[350,60],[380,18],[270,64],[40,120],[372,118],[330,92],[90,96],[180,30],[240,18]];

/* ===== 飛船 ===== */
// 船體大小隨總等級（4～12）從 0.72 長到 1.0
function totalLv(){return SLOTS.reduce((n,s)=>n+S.lv[s.id],0);}
function hullTier(){return [0,2,3][(S.lv.hull||1)-1];}
function hullScale(){return 0.72+0.28*(totalLv()-5)/10;}
function ship(vb,pfx){
  const IDP=pfx||'';
  const L=S.lv, P=Object.fromEntries(SLOTS.map(s=>[s.id,pcol(s.id)]));
  const sc=hullScale(), tier=hullTier(), dl=[0,12,24,34][tier], dr=[0,14,28,40][tier], xl=70-dl, xr=330+dr;
  const wingShape=`<path d="M180 196 C150 168 112 158 60 158 C98 178 128 200 152 214 Z" fill="${P.wing.m}" stroke="${D}" stroke-width="2" stroke-linejoin="round"/>`
    +`<path d="M172 198 Q125 176 78 164 M162 206 Q124 190 92 178 M152 212 Q124 200 108 190" fill="none" stroke="${D}" stroke-opacity=".35" stroke-width="1.4"/>`;
  const wingSpiral=`<path d="${spiral(60,158,1,7,2)}" fill="none" stroke="${P.wing.t}" stroke-width="2" stroke-linecap="round"/>`;
  let wings='';
  if(L.wing>=3) wings+=`<g transform="translate(26,-62) scale(.8)" opacity=".55">${wingShape}${wingSpiral}</g>`;
  if(L.wing>=2) wings+=`<g transform="translate(12,-32) scale(.92)" opacity=".78">${wingShape}${L.wing>=3?wingSpiral:''}</g>`;
  wings+=`<g>${wingShape}${L.wing>=3?wingSpiral:''}</g>`;

  GEARC=P.engine.t;
  const fl=[0,22,38,58][L.engine];
  const glow=L.engine>=2?`<circle cx="60" cy="222" r="${L.engine>=3?52:36}" fill="${P.engine.g}" opacity=".22"/>`:'';
  let engine=`<rect x="28" y="198" width="62" height="46" rx="8" fill="${P.engine.e}" stroke="${D}" stroke-width="2"/>`
    +gear(52,222,16,8,7,false);
  if(L.engine>=2) engine+=gear(76,214,11,7,5,true)+`<path d="M60 198 L60 182 L74 182" fill="none" stroke="${P.engine.t}" stroke-width="3" stroke-linecap="round"/>`;
  if(L.engine>=3) engine+=gear(74,238,10,7,5.5,false)
    +`<rect x="84" y="206" width="14" height="6" rx="2" fill="${P.engine.t}" stroke="${D}" stroke-width="1.2"><animate attributeName="x" values="84;88;84" dur="1.1s" repeatCount="indefinite"/></rect>`;
  const flame=`<g class="flame"><path d="M28 210 Q${(28-fl*0.55).toFixed(1)} 212 ${28-fl} 221 Q${(28-fl*0.55).toFixed(1)} 230 28 232Z" fill="${P.engine.g}"/><path d="M28 215 Q${(28-fl*0.3).toFixed(1)} 217 ${(28-fl*0.55).toFixed(1)} 221 Q${(28-fl*0.3).toFixed(1)} 225 28 227Z" fill="#fff7d6" opacity=".85"/></g>`;

  BRAIDC=P.hull.t;
  let ports='';
  for(let x=xl+95;x<=xr-95;x+=35) ports+=`<circle cx="${x}" cy="234" r="5" fill="${P.hull.g}" stroke="${D}" stroke-width="1.5"/>`;
  const hull=`<path d="M${xl} 188 L${xr} 188 Q${xr-12} 238 ${xr-68} 252 L${xl+68} 252 Q${xl+12} 238 ${xl} 188 Z" fill="${P.hull.b}" stroke="${D}" stroke-width="3" stroke-linejoin="round"/>`
    +`<path d="M${xl+26} 236 Q${(xl+xr)/2} 262 ${xr-26} 232" fill="none" stroke="${D}" stroke-opacity=".35" stroke-width="2"/>`
    +braid(xl+26,xr-24,208,5,28,IDP+'hb')+ports;
  let cabin='';
  if(tier>=3){
    const cx=xl+36;
    cabin=`<rect x="${cx}" y="152" width="58" height="36" rx="4" fill="#6d4b24" stroke="${D}" stroke-width="2.4"/>`
      +`<path d="M${cx-5} 153 Q${cx+29} 128 ${cx+63} 153 Z" fill="${P.hull.b}" stroke="${D}" stroke-width="2.4" stroke-linejoin="round"/>`

function tone(c,t,f,len,vol,type,f1){const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+len);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+len);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+len+.05);}

  try{const c=ac();if(!c)return;const t=c.currentTime+.03;
    tone(c,t,200,1.3,.05,'triangle',900);
    [784,988,1175].forEach((f,i)=>{tone(c,t+.8+i*.2,f,.35,.11,'sine');tone(c,t+.8+i*.2,f*2,.2,.03,'sine');});
    [523,659,784,1047].forEach(f=>tone(c,t+1.0,f,.6,.05,'sine'));
  }catch(e){}
}
function flipSound(){   /* 翻牌：沙沙一掃，翻開後上行的魔法和弦 */
  try{const c=ac();if(!c)return;const t=c.currentTime+.05,len=.6,n=Math.floor(c.sampleRate*len),buf=c.createBuffer(1,n,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;const bp=c.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.1;bp.frequency.setValueAtTime(700,t);bp.frequency.exponentialRampToValueAtTime(4200,t+len);
    const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.2);g.gain.exponentialRampToValueAtTime(.0001,t+len);src.connect(bp);bp.connect(g);g.connect(c.destination);src.start(t);
    [523,659,784,1047,1319].forEach((f,i)=>{tone(c,t+.85+i*.09,f,.5,.1,'sine');tone(c,t+.85+i*.09,f*2,.3,.025,'sine');});
    tone(c,t+1.35,2093,.7,.05,'sine');
  }catch(e){}
}
function zoomHTML(sid,p){   /* 依目前船體縮放與加長量，算出該部位的放大框（4:3） */
  const r=PVB[sid].split(' ').map(Number), sc=hullScale(), tier=hullTier(), dl=[0,12,24,34][tier], dr=[0,14,28,40][tier];
  const sh=sid==='engine'?-dl:sid==='prow'?dr:0;
  let x=200+(r[0]+sh-200)*sc, y=266-(266-r[1])*sc, w=r[2]*sc, h=r[3]*sc;
  const cx=x+w/2, cy=y+h/2; w*=1.12; h*=1.12;
  if(w/h<4/3)w=h*4/3; else h=w*3/4;
  return ship((cx-w/2).toFixed(1)+' '+(cy-h/2).toFixed(1)+' '+w.toFixed(1)+' '+h.toFixed(1),p);
}
function faceHTML(cls,tag,sid,lv,recolor,big,zoom){
  const part=byId(SLOTS,sid), pips=[1,2,3].map(i=>`<span class="pip${i<=lv?' on':''}"></span>`).join('');
  const dsc=recolor?(cls==='b'?'換上新的顏色':'舊的顏色'):`Lv${lv}：${part.d[lv-1]}`;
  return `<div class="face ${cls}" aria-hidden="${cls==='b'?'false':'true'}"><h3>${icon(sid,28)}<span>${part.n}${recolor?'':' Lv'+lv}</span><span class="pips">${pips}</span><span class="tagp">${tag}</span></h3><div class="big">${big}</div><div class="zoom">${zoom}<span>放大：${part.n}</span></div><p class="fdesc">${dsc}</p></div>`;
}
function spotBox(){
  try{if(parent===window||!window.frameElement)return null;
    const r=window.frameElement.getBoundingClientRect(),vh=parent.innerHeight,top=Math.max(0,-r.top),bot=Math.min(r.height,vh-r.top);
    if(bot-top<260)return null; return {top:top,h:bot-top};
  }catch(e){return null;}
}
function placeSpot(){
  if(!spotEl)return; const b=spotBox(), in_=spotEl.querySelector('.spotin');
  if(b){spotEl.classList.add('inframe');spotEl.style.height=Math.max(document.documentElement.scrollHeight,b.top+b.h)+'px';in_.style.top=b.top+'px';in_.style.height=b.h+'px';}
  else{spotEl.classList.remove('inframe');spotEl.style.height='';in_.style.top='';in_.style.height='';}
}
function closeSpot(){
  if(!spotEl)return; if(spotCleanup)spotCleanup(); spotEl.remove(); spotEl=null; busy=false;
}
function showFlip(sid,lvB,lvA,recolor,B,A){
  const el=document.createElement('div'); el.id='spot'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','升級結果');
  el.innerHTML=`<div class="spotin"><div class="flip"><div class="card3d" id="c3d">${faceHTML('a',recolor?'舊顏色':'升級前',sid,lvB,recolor,B.big,B.zoom)}${faceHTML('b',recolor?'新顏色':'升級後！',sid,lvA,recolor,A.big,A.zoom)}</div></div><button class="btn off" id="spotok" data-act="spot-close">太棒了</button></div>`;
  document.body.appendChild(el); spotEl=el; placeSpot();
  let pw=null; try{if(parent!==window)pw=parent;}catch(e){}
  const onMove=()=>placeSpot();
  window.addEventListener('resize',onMove); if(pw){try{pw.addEventListener('scroll',onMove,true);pw.addEventListener('resize',onMove);}catch(e){}}
  const onKey=e=>{if(e.key==='Escape'&&!document.getElementById('spotok').classList.contains('off'))closeSpot();};
  document.addEventListener('keydown',onKey);
  spotCleanup=()=>{window.removeEventListener('resize',onMove);document.removeEventListener('keydown',onKey);if(pw){try{pw.removeEventListener('scroll',onMove,true);pw.removeEventListener('resize',onMove);}catch(e){}}};
  const T=REDUCE?150:700;
  setTimeout(()=>{const c=document.getElementById('c3d'); if(c){c.classList.add('turn');flipSound();}},T);
  setTimeout(()=>{const b=document.getElementById('spotok'); if(b){b.classList.remove('off');try{b.focus({preventScroll:true});}catch(e){}}},REDUCE?400:2500);
}
/* 放入 3 顆碎片後：先在魔法陣上演出，再套用升級、翻牌 */
function castUpgrade(ids,sid){
  busy=true;
  const mc=document.querySelector('.mc'); if(mc)mc.classList.add('cast'); castSound();
  setTimeout(()=>{
    S=load();
    const need={};ids.forEach(x=>{need[x]=(need[x]||0)+1;});
    if(!Object.entries(need).every(([k,v])=>S.el[k]>=v)){busy=false;pick=[null,null,null];render();return;}
    const lvB=S.lv[sid], recolor=lvB>=3;
    const B={big:ship(null,'pa'),zoom:zoomHTML(sid,'pb')};
    Object.entries(need).forEach(([k,v])=>S.el[k]-=v);
    S.cr[sid]=ids; if(!recolor)S.lv[sid]=lvB+1;
    const A={big:ship(null,'pc'),zoom:zoomHTML(sid,'pd')};
    setMsg(recolor?`提煉完成！${byId(SLOTS,sid).n}換上新的顏色。`:`提煉完成！${byId(SLOTS,sid).n}升到 Lv${lvB+1}。`,true);
    pick=[null,null,null]; save(); render();
    showFlip(sid,lvB,recolor?lvB:lvB+1,recolor,B,A);
  },REDUCE?250:1500);
}

/* ===== 事件 ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]'); if(!t) return;
  if(t.dataset.act==='spot-close'){closeSpot();return;}
  if(busy) return;
  if(t.dataset.tab){tab=t.dataset.tab;pick=[null,null,null];render();return;}
  const act=t.dataset.act;
  S=load();   /* 先讀最新存檔，避免蓋掉練習頁剛掉的水晶碎片 */
  if(act==='part'){mcPart=t.dataset.slot;pick=[null,null,null];}
  else if(act==='cycle'){const i=SLOTS.findIndex(s=>s.id===mcPart);mcPart=SLOTS[(i+1)%SLOTS.length].id;pick=[null,null,null];}
  else if(act==='claim'){
    const w=wk(), id=t.dataset.id;
    if((weekDone(w)||S.fake===w.week)&&S.claimed!==w.week&&byId(EL,id)){
      S.el[id]++;S.claimed=w.week;setMsg(`領到「${nameOf(id)}」×1。到「提煉工坊」提煉升級吧。`,true);
    }
  }
  else if(act==='put'){const i=pick.indexOf(null);if(i>=0&&avail(t.dataset.id)>0)pick[i]=t.dataset.id;}
  else if(act==='clear'){pick[+t.dataset.i]=null;}
  else if(act==='inject'){
    const ids=pick.slice(), need={};ids.forEach(x=>{if(x)need[x]=(need[x]||0)+1;});
    if(ids.every(Boolean)&&Object.entries(need).every(([k,v])=>S.el[k]>=v)){castUpgrade(ids,mcPart);return;}
  }
  else if(act==='reset-color'){delete S.cr[mcPart];setMsg(`${byId(SLOTS,mcPart).n}已恢復原色。`);}
  else if(act==='drop'){const el=EL[S.isle-1];S.el[el.id]++;setMsg(`掉落「${el.n}」×1（第 ${S.isle} 島）。`);}
  else if(act==='all3'){EL.forEach(x=>S.el[x.id]+=3);setMsg('每種水晶碎片 +3。');}
  else if(act==='reset'){S=Object.assign(fresh(),{isle:S.isle});pick=[null,null,null];setMsg('飛船已重設。');}
  else if(act==='fake'){const w=wk();S.fake=S.fake===w.week?-1:w.week;setMsg(S.fake===w.week?'已假裝本週任務完成，可到「提煉工坊」領水晶碎片。':'已取消。');}
  else if(act==='unclaim'){S.claimed=-1;setMsg('已重設本週領取。');}
  else if(act==='jumpN'||act==='coin100'){
    try{OLMSave.patch(OLMSave.K.TEST,function(T){
      if(act==='coin100'){T.coins=(T.coins|0)+100;setMsg('金幣 +100（現在 '+T.coins+'）。');}
      else{const n=+document.getElementById('jumpsel').value;T.open=n-1;T.jar=30;S.isle=n;setMsg('已開 '+(n-1)+' 座島、星星罐 30。按一次「星星罐 +10」就會在地圖頁開第 '+n+' 島。');}
    });}catch(e){setMsg('寫入失敗');}
  }
  else if(act==='jar10'||act==='resetOpen'){
    try{OLMSave.patch(OLMSave.K.TEST,function(T){
      if(act==='jar10'){T.jar=Math.min(79,(T.jar==null?9:(T.jar|0))+10);setMsg('星星罐 +10（現在 '+T.jar+'）。罐滿 40 顆，回地圖頁會開島。');}
      else{T.jar=9;T.open=3;T.coins=86;T.own=['hat_straw','bow','book'];T.worn={head:'hat_straw'};S.isle=4;setMsg('開島進度已重設。');}
    });}catch(e){setMsg('寫入失敗');}
  }
  save();render();
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('svg [data-act]')){e.preventDefault();e.target.closest('[data-act]').dispatchEvent(new MouseEvent('click',{bubbles:true}));}
});
document.addEventListener('change',e=>{
  if(e.target.id==='isle'){S=load();S.isle=+e.target.value;save();render();document.getElementById('isle').focus();}
});
document.addEventListener('toggle',e=>{const d=e.target.dataset&&e.target.dataset.d;if(d)openD[d]=e.target.open;},true);
function refresh(){S=load();pick=[null,null,null];render();}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='ship-refresh')refresh();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
window.addEventListener('storage',e=>{if(e.key===KEY||e.key==='olm_wk_v2')refresh();});
if(window.ResizeObserver)new ResizeObserver(report).observe(document.getElementById('wrap'));
window.addEventListener('load',report);
render();
</script>
