<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凱爾特飛船工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Iansui&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 飛行船分頁內容。由 game-test.html 以 iframe 載入，也可單獨開啟測試。
   手機直式：上方飛船舞台，下方三個分頁：組裝／合成／背包。單一亮色主題（羊皮紙底）。 */
:root{
  --parch:#f3e7c9; --parch2:#e6d3a4; --ink:#4a2f1a; --green:#2f5d46; --gold:#b8892f; --night:#14213d;
  --line:#c9ae72; --ok:#2f7a4f; --warn:#a4472b;
  --font-d:'Iansui','Noto Sans TC',serif; --font-b:'Noto Sans TC',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--parch);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;padding:10px 12px 14px}
.stage{border:3px double var(--gold);border-radius:14px;overflow:hidden;background:var(--night);position:relative}
.stage svg{display:block;width:100%;height:auto}
.stage.flash::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(255,240,190,.55),transparent 70%);animation:fade .9s ease-out forwards;pointer-events:none}
@keyframes fade{from{opacity:1}to{opacity:0}}
.status{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 0;font-size:13px}
.pill{white-space:nowrap;display:inline-block;margin:0 4px 4px 0;background:var(--parch2);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.msg{min-height:44px;margin:8px 0;padding:8px 12px;border-left:4px solid var(--green);background:#efe0b8;border-radius:6px;font-size:15px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 10px}
.tabs button{min-height:48px;font:700 16px var(--font-b);color:var(--ink);background:var(--parch2);border:2px solid var(--line);border-radius:10px}
.tabs button[aria-selected="true"]{background:var(--green);color:#fdf6dd;border-color:var(--green)}
button{cursor:pointer}
button:focus-visible{outline:3px solid #1d6fd1;outline-offset:2px}
h2{font-family:var(--font-d);font-size:20px;margin:14px 0 6px;font-weight:400}
.card{background:#f9f0d8;border:2px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px}
.card.gift{border-color:var(--gold);background:#fbefc7}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sname{font-weight:700;font-size:17px}
.pips{display:flex;gap:4px}
.pip{width:14px;height:14px;border-radius:50%;border:2px solid var(--gold);background:transparent}
.pip.on{background:var(--gold)}
.desc{font-size:14px;margin:4px 0 8px;color:#6b4c2a}
.need{font-size:14px;margin:0 0 8px}
.btn{min-height:48px;padding:0 16px;font:700 16px var(--font-b);border-radius:10px;border:2px solid var(--green);background:var(--green);color:#fdf6dd;width:100%}
.btn[disabled]{background:#d9cba4;border-color:#cdbb8a;color:#8d7a52;cursor:not-allowed}
.btn.alt{background:transparent;color:var(--green)}
.btn.small{width:auto;min-height:40px;padding:0 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px;padding:8px 4px;background:#fbf4de;border:2px solid var(--line);border-radius:10px;font:500 14px var(--font-b);color:var(--ink)}
.chip b{font-size:15px}
.chip small{color:#7a5a36;font-size:12px}
.chip[disabled]{opacity:.45;cursor:not-allowed}
.gem{width:26px;height:26px}
.circle{display:flex;align-items:center;justify-content:center;gap:12px;margin:6px 0 10px}
.slotbox{width:84px;height:84px;border-radius:50%;border:3px dashed var(--gold);background:#fbf4de;display:flex;flex-direction:column;align-items:center;justify-content:center;font:500 13px var(--font-b);color:var(--ink);padding:0}
.slotbox.full{border-style:solid}
.plus{font:700 24px var(--font-d);color:var(--gold)}
.preview{text-align:center;min-height:48px;margin:0 0 8px;font-size:15px}
.preview.bad{color:var(--warn)}
details{margin:6px 0}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700}
.rec{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.rec:last-child{border-bottom:0}
.tag{font-size:12px;border-radius:6px;padding:1px 6px;border:1px solid var(--line);background:var(--parch2);white-space:nowrap}
.sw{width:18px;height:18px;border-radius:50%;border:1px solid var(--ink);flex:none}
select{min-height:44px;font:500 16px var(--font-b);border:2px solid var(--line);border-radius:8px;background:#fbf4de;color:var(--ink);padding:0 8px}
.notes{font-size:13px;color:#6b4c2a;padding-left:18px;margin:6px 0}
.notes li{margin:3px 0}
.spin{transform-box:fill-box;transform-origin:center;animation:spin linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.flame{transform-origin:28px 221px;animation:fl .35s ease-in-out infinite alternate}
@keyframes fl{to{transform:scaleX(.78)}}
.pulse{animation:pl 2s ease-in-out infinite}
@keyframes pl{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.spin,.bob,.flame,.pulse,.stage.flash::after{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage"></div>
  <div class="status" id="status"></div>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" id="tab-build" data-tab="build" aria-selected="true">組裝</button>
    <button role="tab" id="tab-craft" data-tab="craft" aria-selected="false">合成</button>
    <button role="tab" id="tab-bag" data-tab="bag" aria-selected="false">背包</button>
  </div>
  <div id="panel"></div>
</div>

<script>
/* ===== 資料（名稱、配方、數值都是暫定） ===== */
const EL=[
  {id:'stardust',n:'星塵',isle:'星光草原',c:'#f2c94c'},
  {id:'moonwater',n:'月光水',isle:'月光湖',c:'#8fc1ff'},
  {id:'rainbow',n:'彩虹絲',isle:'彩虹雲島',c:'#ff8ad0'},
  {id:'cloud',n:'雲絮',isle:'棉花雲島',c:'#dfe6f7'},
  {id:'glowdew',n:'螢光露',isle:'山谷河流',c:'#7be0a0'},
  {id:'lantern',n:'燈籠火',isle:'燈籠森林',c:'#ff9a3d'},
  {id:'core',n:'星核砂',isle:'星系燈塔',c:'#a3b1c6'},
  {id:'seaglass',n:'海玻璃',isle:'海灘',c:'#3fc6c6'},
  {id:'note',n:'音符晶',isle:'音符花園',c:'#c77dff'}
];
const MAT=[
  {id:'sailcloth',n:'星紋布',slot:'sail'},
  {id:'feather',n:'風羽',slot:'wing'},
  {id:'gearcore',n:'齒輪核心',slot:'engine'},
  {id:'navcrystal',n:'導航晶',slot:'prow'}
];
const EN=[
  {id:'silver',n:'銀月能源',c1:'#9ec5ff',c2:'#e8f1ff'},
  {id:'green',n:'翠光能源',c1:'#5fd69a',c2:'#c9ffe0'},
  {id:'dawn',n:'晨曦能源',c1:'#ff9fbf',c2:'#ffd9a0'},
  {id:'deep',n:'深海能源',c1:'#36b9d0',c2:'#9ff1ff'},
  {id:'amber',n:'琥珀能源',c1:'#ffb347',c2:'#ffe2a3'},
  {id:'violet',n:'紫音能源',c1:'#b27cff',c2:'#e4ccff'}
];
const COL={default:{n:'原色',c1:'#f0e2b8',c2:'#ffb84a'}};
EN.forEach(e=>COL[e.id]={n:e.n,c1:e.c1,c2:e.c2});
const SLOTS=[
  {id:'sail',n:'風帆',d:['簡單帆面，一個三圈紋','加上後帆與紋樣邊','加上旗幟與符文光環']},
  {id:'wing',n:'機翼',d:['單層羽翼','雙層羽翼','三層羽翼，翼尖有螺旋']},
  {id:'engine',n:'引擎',d:['一組齒輪','兩組齒輪連動','三組齒輪、活塞與長尾焰']},
  {id:'prow',n:'船頭',d:['簡單船頭','螺旋船首像','導航水晶與紋環']}
];
/* 異種配方：兩種不同的元素 */
const RECIPES=[
  {a:'cloud',b:'stardust',t:'mat',o:'sailcloth'},
  {a:'rainbow',b:'moonwater',t:'mat',o:'feather'},
  {a:'lantern',b:'glowdew',t:'mat',o:'gearcore'},
  {a:'core',b:'seaglass',t:'mat',o:'navcrystal'},
  {a:'stardust',b:'moonwater',t:'en',o:'silver'},
  {a:'stardust',b:'glowdew',t:'en',o:'green'},
  {a:'rainbow',b:'cloud',t:'en',o:'dawn'},
  {a:'moonwater',b:'seaglass',t:'en',o:'deep'},
  {a:'lantern',b:'core',t:'en',o:'amber'},
  {a:'note',b:'rainbow',t:'en',o:'violet'}
];
/* 基礎配方：兩個「同種」元素 → 該元素所屬零件的升級材料；只在該零件還是 Lv1、且手上沒有該材料時可用（暫定） */
const BASE={stardust:'sail',cloud:'sail',note:'sail',rainbow:'wing',moonwater:'wing',lantern:'engine',glowdew:'engine',core:'prow',seaglass:'prow'};
const byId=(arr,id)=>arr.find(x=>x.id===id);
const COST=[1,2]; // Lv1→2 需 1 個材料，Lv2→3 需 2 個材料

/* ===== 每週任務（要和 weekly-practice.html 一致；讀它的存檔 olm_wk_v2） ===== */
const TASKS=[{id:'basic-1-1',name:'基本指法 1-1',weight:1,T:20}];
function todayKey(){return new Date(Date.now()+8*3600e3).toISOString().slice(0,10);}
function weekIdx(start){return Math.max(0,Math.floor((Date.parse(todayKey()+'T00:00:00Z')-Date.parse(start+'T00:00:00Z'))/864e5/7));}
function wk(){
  try{
    const o=JSON.parse(localStorage.getItem('olm_wk_v2')||'null');
    if(o&&o.v===2){
      const st=o.start||todayKey(), idx=weekIdx(st), prev=typeof o.week==='number'?o.week:0;
      return {has:true,week:idx,tasks:prev===idx?(o.tasks||{}):{}};
    }
  }catch(e){}
  return {has:false,week:0,tasks:{}};
}
function weekDone(w){return TASKS.every(t=>(w.tasks[t.id]|0)>=t.T)&&w.has;}

/* ===== 狀態 ===== */
const KEY='olm_ship_v1';
const DEFAULT_ISLE=4;   /* 測試版不真的開島，「目前練習的島」暫定為地圖上的第 4 島；weekly-practice.html 讀同一個欄位決定掉哪種元素 */
function fresh(){
  return {el:Object.fromEntries(EL.map(e=>[e.id,0])),
    mat:Object.fromEntries(MAT.map(m=>[m.id,0])),
    en:Object.fromEntries(EN.map(e=>[e.id,0])),
    lv:{sail:1,wing:1,engine:1,prow:1},color:'default',isle:DEFAULT_ISLE,claimed:-1,fake:-1};
}
function load(){
  const f=fresh();
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return f;
    const s=JSON.parse(raw)||{};
    ['el','mat','en','lv'].forEach(k=>Object.assign(f[k],s[k]||{}));
    if(COL[s.color]) f.color=s.color;
    if(s.isle>=1&&s.isle<=9) f.isle=s.isle;
    if(typeof s.claimed==='number') f.claimed=s.claimed;
    if(typeof s.fake==='number') f.fake=s.fake;
  }catch(e){}
  return f;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load(), tab='build', pick=[null,null], msg='', openD={tools:false,book:false};

/* ===== 繪圖輔助 ===== */
const D='#3a2414', W='#8b5a33', G='#d9b25b';
function gearPath(cx,cy,r,t){
  const ri=r*0.78, step=Math.PI*2/t, pts=[];
  for(let i=0;i<t;i++){
    [[-0.28,ri],[-0.16,r],[0.16,r],[0.28,ri]].forEach(([d,rad])=>{
      const a=i*step+d*step;
      pts.push((cx+Math.cos(a)*rad).toFixed(1)+','+(cy+Math.sin(a)*rad).toFixed(1));
    });
  }
  return 'M'+pts.join('L')+'Z';
}
function spiral(cx,cy,r0,r1,turns){
  let d=''; const n=60;
  for(let i=0;i<=n;i++){
    const t=i/n, a=t*turns*Math.PI*2, r=r0+(r1-r0)*t;
    d+=(i?'L':'M')+(cx+Math.cos(a)*r).toFixed(1)+','+(cy+Math.sin(a)*r).toFixed(1);
  }
  return d;
}
function gear(cx,cy,r,t,dur,rev){
  return `<g class="spin" style="animation-duration:${dur}s;animation-direction:${rev?'reverse':'normal'}"><path d="${gearPath(cx,cy,r,t)}" fill="#a07a3e" stroke="${D}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${cx}" cy="${cy}" r="${(r*0.58).toFixed(1)}" fill="#6d4b24" stroke="${D}" stroke-width="1"/><path d="${spiral(cx,cy,1.5,r*0.5,2.2)}" fill="none" stroke="${G}" stroke-width="1.6" stroke-linecap="round"/></g>`;
}
function emblem(cx,cy,r,col){
  const pts=[0,120,240].map(d=>{const a=(d-90)*Math.PI/180;return [cx+Math.cos(a)*r*0.55,cy+Math.sin(a)*r*0.55];});
  return pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${(r*0.6).toFixed(1)}" fill="none" stroke="${col}" stroke-width="2.2"/>`).join('')
    +`<circle cx="${cx}" cy="${cy}" r="${(r*1.25).toFixed(1)}" fill="none" stroke="${col}" stroke-width="1.6"/>`;
}
function braid(x1,x2,y,amp,wl,id){
  let a='',b='';
  for(let x=x1;x<=x2;x+=2){
    const t=(x-x1)/wl*Math.PI*2;
    a+=(x===x1?'M':'L')+x+','+(y+Math.sin(t)*amp).toFixed(1);
    b+=(x===x1?'M':'L')+x+','+(y-Math.sin(t)*amp).toFixed(1);
  }
  const st=d=>`<path d="${d}" fill="none" stroke="${D}" stroke-width="6" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${G}" stroke-width="3.2" stroke-linecap="round"/>`;
  let s=st(a)+st(b), k=0;
  for(let x=x1+wl/2;x<x2;x+=wl){
    k++;
    s+=`<clipPath id="${id}${k}"><rect x="${x-7}" y="${y-amp-6}" width="14" height="${amp*2+12}"/></clipPath><g clip-path="url(#${id}${k})">${st(a)}</g>`;
  }
  return s;
}
const STARS=[[-70,80],[-60,140],[430,110],[425,160],[-75,30],[-40,50],[-20,110],[404,70],[410,30],[-50,20],[20,20],[60,60],[110,24],[150,70],[300,26],[350,60],[380,18],[270,64],[40,120],[372,118],[330,92],[90,96],[180,30],[240,18]];

/* ===== 飛船 ===== */
// 船體大小隨總等級（4～12）從 0.72 長到 1.0
function totalLv(){return SLOTS.reduce((n,s)=>n+S.lv[s.id],0);}
function hullTier(){const n=totalLv();return n>=12?3:n>=10?2:n>=7?1:0;}
function hullScale(){return 0.72+0.28*(totalLv()-4)/8;}
function ship(){
  const k=COL[S.color], c1=k.c1, c2=k.c2, L=S.lv;
  const sc=hullScale(), tier=hullTier(), dl=[0,12,24,34][tier], dr=[0,14,28,40][tier], xl=70-dl, xr=330+dr;
  const wingShape=`<path d="M180 196 C150 168 112 158 60 158 C98 178 128 200 152 214 Z" fill="${c1}" stroke="${D}" stroke-width="2" stroke-linejoin="round"/>`
    +`<path d="M172 198 Q125 176 78 164 M162 206 Q124 190 92 178 M152 212 Q124 200 108 190" fill="none" stroke="${D}" stroke-opacity=".35" stroke-width="1.4"/>`;
  const wingSpiral=`<path d="${spiral(60,158,1,7,2)}" fill="none" stroke="${G}" stroke-width="2" stroke-linecap="round"/>`;
  let wings='';
  if(L.wing>=3) wings+=`<g transform="translate(26,-62) scale(.8)" opacity=".55">${wingShape}${wingSpiral}</g>`;
  if(L.wing>=2) wings+=`<g transform="translate(12,-32) scale(.92)" opacity=".78">${wingShape}${L.wing>=3?wingSpiral:''}</g>`;
  wings+=`<g>${wingShape}${L.wing>=3?wingSpiral:''}</g>`;

  const fl=[0,22,38,58][L.engine];
  const glow=L.engine>=2?`<circle cx="60" cy="222" r="${L.engine>=3?52:36}" fill="${c2}" opacity=".22"/>`:'';
  let engine=`<rect x="28" y="198" width="62" height="46" rx="8" fill="#5b3a22" stroke="${D}" stroke-width="2"/>`
    +gear(52,222,16,8,7,false);
  if(L.engine>=2) engine+=gear(76,214,11,7,5,true)+`<path d="M60 198 L60 182 L74 182" fill="none" stroke="${G}" stroke-width="3" stroke-linecap="round"/>`;
  if(L.engine>=3) engine+=gear(74,238,10,7,5.5,false)
    +`<rect x="84" y="206" width="14" height="6" rx="2" fill="${G}" stroke="${D}" stroke-width="1.2"><animate attributeName="x" values="84;88;84" dur="1.1s" repeatCount="indefinite"/></rect>`;
  const flame=`<g class="flame"><path d="M28 210 Q${(28-fl*0.55).toFixed(1)} 212 ${28-fl} 221 Q${(28-fl*0.55).toFixed(1)} 230 28 232Z" fill="${c2}"/><path d="M28 215 Q${(28-fl*0.3).toFixed(1)} 217 ${(28-fl*0.55).toFixed(1)} 221 Q${(28-fl*0.3).toFixed(1)} 225 28 227Z" fill="#fff7d6" opacity=".85"/></g>`;

  let ports='';
  for(let x=xl+95;x<=xr-95;x+=35) ports+=`<circle cx="${x}" cy="234" r="5" fill="${c2}" stroke="${D}" stroke-width="1.5"/>`;
  const hull=`<path d="M${xl} 188 L${xr} 188 Q${xr-12} 238 ${xr-68} 252 L${xl+68} 252 Q${xl+12} 238 ${xl} 188 Z" fill="${W}" stroke="${D}" stroke-width="3" stroke-linejoin="round"/>`
    +`<path d="M${xl+26} 236 Q${(xl+xr)/2} 262 ${xr-26} 232" fill="none" stroke="${D}" stroke-opacity=".35" stroke-width="2"/>`
    +braid(xl+26,xr-24,208,5,28,'hb')+ports;
  let cabin='';
  if(tier>=3){
    const cx=xl+36;
    cabin=`<rect x="${cx}" y="152" width="58" height="36" rx="4" fill="#6d4b24" stroke="${D}" stroke-width="2.4"/>`
      +`<path d="M${cx-5} 153 Q${cx+29} 128 ${cx+63} 153 Z" fill="${W}" stroke="${D}" stroke-width="2.4" stroke-linejoin="round"/>`
      +`<path d="${spiral(cx+29,143,1,6,2)}" fill="none" stroke="${G}" stroke-width="1.8" stroke-linecap="round"/>`
      +`<rect x="${cx+7}" y="162" width="12" height="12" rx="3" fill="${c2}" stroke="${D}" stroke-width="1.6"/><rect x="${cx+39}" y="162" width="12" height="12" rx="3" fill="${c2}" stroke="${D}" stroke-width="1.6"/>`
      +`<path d="M${cx+22} 188 V170 Q${cx+29} 164 ${cx+36} 170 V188" fill="#3a2414" stroke="${D}" stroke-width="1.4"/>`;
  }
  let rail='';
  if(tier>=1){
    const rx1=xl+22, rx2=xr-22;
    rail+=`<path d="M${rx1} 176 H${rx2}" stroke="${D}" stroke-width="5" stroke-linecap="round"/><path d="M${rx1} 176 H${rx2}" stroke="${G}" stroke-width="2.6" stroke-linecap="round"/>`;
    for(let x=rx1;x<=rx2+1;x+=18) rail+=`<path d="M${x} 176 V188" stroke="${D}" stroke-width="3.4" stroke-linecap="round"/><path d="M${x} 176 V188" stroke="${G}" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  if(tier>=2){
    rail+=`<path d="M${xl+22} 182 H${xr-22}" stroke="${G}" stroke-width="1.6"/>`;
    [xl+22,xr-22].forEach(x=>{rail+=`<circle class="pulse" cx="${x}" cy="168" r="11" fill="${c2}" opacity=".35"/><circle cx="${x}" cy="168" r="5" fill="${c2}" stroke="${D}" stroke-width="1.6"/><path d="M${x} 173 V176" stroke="${D}" stroke-width="2"/>`;});
  }

  let sails=`<line x1="215" y1="36" x2="215" y2="190" stroke="${D}" stroke-width="5" stroke-linecap="round"/><circle cx="215" cy="34" r="4" fill="${G}" stroke="${D}" stroke-width="1.5"/>`;
  if(L.sail>=2) sails+=`<path d="M211 62 C160 90 150 140 158 182 L211 182 Z" fill="${c1}" fill-opacity=".85" stroke="${D}" stroke-width="2.2" stroke-linejoin="round"/>${emblem(186,138,9,G)}`;
  sails+=`<path d="M215 40 C290 70 305 135 288 182 L215 182 Z" fill="${c1}" fill-opacity=".95" stroke="${D}" stroke-width="2.4" stroke-linejoin="round"/>`;
  if(L.sail>=2) sails+=`<path d="M222 56 C282 84 294 136 280 174" fill="none" stroke="${G}" stroke-width="2.2" stroke-dasharray="2 5" stroke-linecap="round"/><path d="${spiral(278,170,1,9,2.2)}" fill="none" stroke="${G}" stroke-width="2" stroke-linecap="round"/>`;
  sails+=emblem(255,118,12,G);
  if(L.sail>=3) sails+=`<path d="M215 22 L254 31 L215 42 Z" fill="${c2}" stroke="${D}" stroke-width="1.8" stroke-linejoin="round"/><circle class="pulse" cx="255" cy="118" r="30" fill="none" stroke="${c2}" stroke-width="2.4"/><circle class="pulse" cx="255" cy="118" r="38" fill="none" stroke="${c2}" stroke-width="1.2" stroke-dasharray="3 5"/>`;

  if(tier>=3){
    sails+=`<line x1="215" y1="36" x2="318" y2="104" stroke="${G}" stroke-width="1.4" stroke-opacity=".8"/>`
      +`<line x1="318" y1="188" x2="318" y2="98" stroke="${D}" stroke-width="4.4" stroke-linecap="round"/><circle cx="318" cy="96" r="3.4" fill="${G}" stroke="${D}" stroke-width="1.3"/>`
      +`<path d="M318 104 Q356 134 354 182 L318 182 Z" fill="${c1}" fill-opacity=".92" stroke="${D}" stroke-width="2.2" stroke-linejoin="round"/>`
      +emblem(334,148,7,G)
      +`<path d="M318 82 L346 89 L318 96 Z" fill="${c2}" stroke="${D}" stroke-width="1.5" stroke-linejoin="round"/>`;
  }
  let prow=`<path d="M318 190 C346 190 358 170 354 146 C342 168 326 176 304 178 Z" fill="${W}" stroke="${D}" stroke-width="2.6" stroke-linejoin="round"/>`;
  if(L.prow>=2) prow+=`<path d="${spiral(352,140,1.5,13,2.3)}" fill="none" stroke="${D}" stroke-width="5.5" stroke-linecap="round"/><path d="${spiral(352,140,1.5,13,2.3)}" fill="none" stroke="${G}" stroke-width="3" stroke-linecap="round"/>`;
  if(L.prow>=3) prow+=`<circle cx="352" cy="112" r="24" fill="${c2}" opacity=".25" class="pulse"/><circle cx="352" cy="112" r="18" fill="none" stroke="${G}" stroke-width="2" stroke-dasharray="4 4"/><path d="M352 98 L362 112 L352 128 L342 112 Z" fill="${c2}" stroke="${D}" stroke-width="2" stroke-linejoin="round"/>`;

  const stars=STARS.map(s=>`<circle cx="${s[0]}" cy="${s[1]}" r="1.4" fill="#fdf6dd" opacity=".8"/>`).join('');
  return `<svg viewBox="-80 0 520 290" role="img" aria-label="凱爾特風格飛船，總等級${totalLv()}、風帆${L.sail}級、機翼${L.wing}級、引擎${L.engine}級、船頭${L.prow}級，目前顏色：${k.n}">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e1a38"/><stop offset="1" stop-color="#2a3b6b"/></linearGradient></defs>
<rect x="-80" width="520" height="290" fill="url(#sky)"/>${stars}
<g transform="translate(200 266) scale(${sc.toFixed(3)}) translate(-200 -266)"><g class="bob"><g transform="translate(${-dl} 0)">${glow}</g>${wings}<g transform="translate(${-dl} 0)">${flame}</g>${hull}${cabin}${rail}<g transform="translate(${-dl} 0)">${engine}</g>${sails}<g transform="translate(${dr} 0)">${prow}</g></g></g></svg>`;
}

/* ===== 介面 ===== */
const DEF_MSG='點「組裝」升級零件，或到「合成」把元素變成材料與能源。';
function gemSvg(c){return `<svg class="gem" viewBox="0 0 26 26" aria-hidden="true"><path d="M13 2 L23 11 L13 24 L3 11 Z" fill="${c}" stroke="#4a2f1a" stroke-width="1.6" stroke-linejoin="round"/><path d="M3 11 H23 M13 2 L9 11 L13 24 L17 11 Z" fill="none" stroke="#4a2f1a" stroke-opacity=".45" stroke-width="1"/></svg>`;}
function nameOf(type,id){
  return type==='mat'?byId(MAT,id).n:type==='en'?byId(EN,id).n:byId(EL,id).n;
}
function setMsg(t,flash){
  msg=t; if(flash){const st=document.getElementById('stage');st.classList.remove('flash');void st.offsetWidth;st.classList.add('flash');}
}
function renderTop(){
  document.getElementById('stage').innerHTML=ship();
  document.getElementById('status').innerHTML=
    SLOTS.map(s=>`<span class="pill">${s.n} Lv${S.lv[s.id]}</span>`).join('')+`<span class="pill">顏色：${COL[S.color].n}</span><span class="pill">船體 ${totalLv()}／12（第 ${hullTier()+1} 階）</span>`;
  document.getElementById('msg').textContent=msg||DEF_MSG;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));
}
function allMaxed(){return SLOTS.every(s=>S.lv[s.id]>=3);}
function giftCard(){
  const w=wk(), done=weekDone(w)||S.fake===w.week, got=S.claimed===w.week;
  const prog=TASKS.map(t=>t.name+' '+Math.min(w.tasks[t.id]|0,t.T)+'／'+t.T).join('　');
  let body;
  if(got) body=`<p class="need">本週的升級材料已經領了。下週完成任務再來領。</p>`;
  else if(allMaxed()) body=`<p class="need">四個零件都升滿了。升滿後的每週獎勵還在設計中。</p>`;
  else if(!done) body=`<p class="need">完成本週任務目標，就能領 1 個升級材料，自己選要升哪個零件。<br>${w.has?'目前進度：'+prog:'這週還沒開始練習。到「練習」頁完成每週任務吧。'}</p>`;
  else body=`<p class="need"><b>本週任務完成！</b>選一個零件領 1 個材料：</p><div class="grid2">${SLOTS.map(s=>`<button class="btn" data-act="claim" data-slot="${s.id}" ${S.lv[s.id]>=3?'disabled':''}>${s.n}（${byId(MAT,MAT.find(m=>m.slot===s.id).id).n}）</button>`).join('')}</div>`;
  return `<div class="card gift"><div class="row"><span class="sname">每週材料</span><span class="tag">第 ${w.week+1} 週</span></div>${body}</div>`;
}
function buildPanel(){
  return giftCard()+SLOTS.map(s=>{
    const lv=S.lv[s.id], mat=MAT.find(m=>m.slot===s.id), have=S.mat[mat.id];
    const pips=[1,2,3].map(i=>`<span class="pip${i<=lv?' on':''}"></span>`).join('');
    let need,btn;
    if(lv>=3){need='已滿級';btn=`<button class="btn" disabled>已滿級</button>`;}
    else{
      const c=COST[lv-1];
      need=`升到 Lv${lv+1} 需要「${mat.n}」×${c}（目前有 ${have}）`;
      btn=`<button class="btn" data-act="up" data-slot="${s.id}" ${have>=c?'':'disabled'}>升級${s.n}</button>`;
    }
    return `<div class="card"><div class="row"><span class="sname">${s.n}</span><span class="pips" aria-label="等級 ${lv}／3">${pips}</span></div>
<p class="desc">Lv${lv}：${s.d[lv-1]}</p><p class="need">${need}</p>${btn}</div>`;
  }).join('')+`<p class="notes">船體會隨四個零件的總等級變大變長：總等級 7 起加欄杆，10 起加雙欄杆與提燈，12 滿級加甲板小屋與第二根桅桿。材料可以靠每週任務領，也能到「合成」用元素做。升級成本是暫定：Lv1→2 需 1 個、Lv2→3 需 2 個。</p>`;
}
function avail(id){return S.el[id]-pick.filter(p=>p===id).length;}
function findRecipe(a,b){
  if(!a||!b) return null;
  if(a===b){
    const slot=BASE[a], mat=MAT.find(m=>m.slot===slot);
    return (S.lv[slot]===1&&S.mat[mat.id]<1)?{a,b,t:'mat',o:mat.id,base:true}:null;
  }
  return RECIPES.find(x=>(x.a===a&&x.b===b)||(x.a===b&&x.b===a))||null;
}
function whyNot(a,b){
  if(a===b){
    const slot=BASE[a], sl=byId(SLOTS,slot), mat=MAT.find(m=>m.slot===slot);
    if(S.lv[slot]>1) return `${sl.n}已經超過 Lv1，同種元素的基礎配方用不到了。`;
    if(S.mat[mat.id]>=1) return `手上已經有「${mat.n}」，先去升級${sl.n}吧。`;
  }
  return '這個組合沒有配方。按合成也不會用掉元素。';
}
function craftPanel(){
  const a=pick[0],b=pick[1], r=findRecipe(a,b);
  const box=(i)=>{const id=pick[i];return id?`<button class="slotbox full" data-act="clear" data-i="${i}" aria-label="取出${nameOf('el',id)}">${gemSvg(byId(EL,id).c)}${nameOf('el',id)}</button>`:`<button class="slotbox" data-act="none" disabled>放入元素</button>`;};
  let prev;
  if(!a||!b) prev='再放入元素，湊滿兩個。';
  else if(r) prev=`會合成：<b>${nameOf(r.t,r.o)}</b>（${r.base?'基礎配方，升級材料':r.t==='mat'?'升級材料':'換色能源'}）`;
  else prev=whyNot(a,b);
  const chips=EL.map(e=>`<button class="chip" data-act="put" data-id="${e.id}" ${avail(e.id)>0?'':'disabled'}>${gemSvg(e.c)}<b>${e.n}</b><small>×${avail(e.id)}</small></button>`).join('');
  const book=RECIPES.map(x=>{
    const o=nameOf(x.t,x.o);
    const sw=x.t==='en'?`<span class="sw" style="background:${byId(EN,x.o).c1}"></span>`:'';
    return `<div class="rec"><span class="tag">${x.t==='mat'?'材料':'能源'}</span><span>${nameOf('el',x.a)} ＋ ${nameOf('el',x.b)} → <b>${o}</b></span>${sw}</div>`;
  }).join('');
  const baseBook=MAT.map(m=>`<div class="rec"><span class="tag">基礎</span><span>${Object.keys(BASE).filter(k=>BASE[k]===m.slot).map(k=>nameOf('el',k)).join('、')} 任兩個同種 → <b>${m.n}</b></span></div>`).join('');
  const mats=MAT.map(m=>`<span class="pill">${m.n} ×${S.mat[m.id]}</span>`).join(' ');
  const ens=EN.map(e=>`<div class="row" style="padding:4px 0"><span><span class="sw" style="display:inline-block;vertical-align:middle;background:${e.c1};margin-right:6px"></span>${e.n} ×${S.en[e.id]}</span><button class="btn small" data-act="inject" data-id="${e.id}" ${S.en[e.id]>0?'':'disabled'}>注入</button></div>`).join('');
  return `<h2>魔法陣</h2><div class="card"><div class="circle">${box(0)}<span class="plus">＋</span>${box(1)}</div>
<p class="preview${a&&b&&!r?' bad':''}">${prev}</p><button class="btn" data-act="craft" ${r?'':'disabled'}>合成</button></div>
<div class="grid">${chips}</div>
<h2>我的材料與能源</h2><div class="card"><p style="margin:0 0 8px">${mats}</p>${ens}
<button class="btn alt small" style="margin-top:8px" data-act="reset-color" ${S.color==='default'?'disabled':''}>恢復原色</button>
<p class="desc" style="margin:8px 0 0">注入會用掉 1 個能源，船身換成該顏色。之後可再注入別的顏色（暫定）。</p></div>
<details data-d="book" ${openD.book?'open':''}><summary>配方本</summary><div class="card">${baseBook}<p class="desc" style="margin:6px 0">基礎配方只在該零件還是 Lv1、且手上沒有該材料時可用（暫定）。</p>${book}</div></details>`;
}
function bagPanel(){
  const els=EL.map(e=>`<div class="chip" style="cursor:default">${gemSvg(e.c)}<b>${e.n}</b><small>${e.isle}</small><small>×${S.el[e.id]}</small></div>`).join('');
  const opts=EL.map((e,i)=>`<option value="${i+1}" ${S.isle===i+1?'selected':''}>第 ${i+1} 島 ${e.isle}</option>`).join('');
  const w=wk();
  return `<h2>元素（每島一種）</h2><div class="grid">${els}</div>
<p class="notes">元素在「練習」頁超過任務目標後掉落，依「目前練習的島」決定是哪一種。</p>
<details data-d="tools" ${openD.tools?'open':''}><summary>測試工具</summary><div class="card">
<label for="isle" class="need" style="display:block">目前練習的島（練習頁掉的元素會跟著變）</label>
<select id="isle" data-act="isle" style="width:100%;margin-bottom:8px">${opts}</select>
<button class="btn" data-act="drop">模擬掉落 1 次（${EL[S.isle-1].n}）</button>
<div class="grid2" style="margin-top:8px">
<button class="btn alt" data-act="all3">每種 +3</button><button class="btn alt" data-act="reset">重設飛船</button></div>
<button class="btn alt" style="margin-top:8px" data-act="fake">${S.fake===w.week?'取消「假裝本週任務完成」':'假裝本週任務完成'}</button>
<button class="btn alt" style="margin-top:8px" data-act="unclaim" ${S.claimed===w.week?'':'disabled'}>重設本週材料領取</button></div></details>
<h2>這版的暫定假設</h2><ul class="notes">
<li>元素名稱第 5～9 島是暫擬。配方共 10 條異種配方，再加基礎配方。</li>
<li>每週完成任務目標領 1 個材料，同一週只能領一次，不補領。</li>
<li>升滿後的每週獎勵、船體進化、種籽與寵物蛋都還沒做。</li>
<li>重設飛船只清飛船資料，不動星星罐與練習進度。</li></ul>`;
}
function renderPanel(){
  document.getElementById('panel').innerHTML=tab==='build'?buildPanel():tab==='craft'?craftPanel():bagPanel();
}
function report(){try{if(parent!==window)parent.postMessage({type:'ship-h',h:document.getElementById('wrap').offsetHeight},'*');}catch(e){}}
function render(){renderTop();renderPanel();report();}

/* ===== 事件 ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-act]'); if(!t) return;
  if(t.dataset.tab){tab=t.dataset.tab;pick=[null,null];render();return;}
  const act=t.dataset.act;
  S=load();   /* 先讀最新存檔，避免蓋掉練習頁剛掉的元素 */
  if(act==='up'){
    const sid=t.dataset.slot, lv=S.lv[sid], mat=MAT.find(m=>m.slot===sid), c=COST[lv-1];
    if(lv<3&&S.mat[mat.id]>=c){S.mat[mat.id]-=c;S.lv[sid]=lv+1;setMsg(`${byId(SLOTS,sid).n}升到 Lv${lv+1}。`,true);}
  }else if(act==='claim'){
    const w=wk(), sid=t.dataset.slot, mat=MAT.find(m=>m.slot===sid);
    if((weekDone(w)||S.fake===w.week)&&S.claimed!==w.week&&S.lv[sid]<3){
      S.mat[mat.id]++;S.claimed=w.week;
      setMsg(`領到「${mat.n}」×1。往下找${byId(SLOTS,sid).n}，材料夠就能升級。`,true);
    }
  }else if(act==='put'){
    const i=pick[0]?(pick[1]?-1:1):0;
    if(i>=0&&avail(t.dataset.id)>0) pick[i]=t.dataset.id;
  }else if(act==='clear'){pick[+t.dataset.i]=null;}
  else if(act==='craft'){
    const [a,b]=pick, r=findRecipe(a,b);
    if(r&&S.el[a]>=1&&S.el[b]>=(a===b?2:1)){S.el[a]--;S.el[b]--;(r.t==='mat'?S.mat:S.en)[r.o]++;pick=[null,null];setMsg(`合成成功，獲得「${nameOf(r.t,r.o)}」×1。`,true);}
  }else if(act==='inject'){
    const id=t.dataset.id; if(S.en[id]>0){S.en[id]--;S.color=id;setMsg(`注入${nameOf('en',id)}，飛船變成${COL[id].n.replace('能源','')}色。`,true);}
  }else if(act==='reset-color'){S.color='default';setMsg('已恢復原色。');}
  else if(act==='drop'){const el=EL[S.isle-1];S.el[el.id]++;setMsg(`掉落「${el.n}」×1（第 ${S.isle} 島）。`);}
  else if(act==='all3'){EL.forEach(x=>S.el[x.id]+=3);setMsg('每種元素 +3。');}
  else if(act==='reset'){S=Object.assign(fresh(),{isle:S.isle});pick=[null,null];setMsg('飛船已重設。');}
  else if(act==='fake'){const w=wk();S.fake=S.fake===w.week?-1:w.week;setMsg(S.fake===w.week?'已假裝本週任務完成，可到「組裝」領材料。':'已取消。');}
  else if(act==='unclaim'){S.claimed=-1;setMsg('已重設本週領取。');}
  save();render();
});
document.addEventListener('change',e=>{
  if(e.target.id==='isle'){S=load();S.isle=+e.target.value;save();render();document.getElementById('isle').focus();}
});
document.addEventListener('toggle',e=>{const d=e.target.dataset&&e.target.dataset.d;if(d)openD[d]=e.target.open;},true);
function refresh(){S=load();pick=[null,null];render();}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='ship-refresh')refresh();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
window.addEventListener('storage',e=>{if(e.key===KEY||e.key==='olm_wk_v2')refresh();});
if(window.ResizeObserver)new ResizeObserver(report).observe(document.getElementById('wrap'));
window.addEventListener('load',report);
render();
</script>
</body>
